name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Analytic continuation reads the SLURM variable even outside a cluster.
    # Limit numerical libraries too, to avoid nested thread oversubscription.
    env:
      SLURM_JOB_CPUS_PER_NODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      MPLBACKEND: Agg

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
            requirements.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libeigen3-dev libgmp-dev libmpfr-dev \
            libfftw3-dev libopenblas-dev liblapack-dev libhdf5-dev

      - name: Build and install package with test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[tests]" scs
          python -m pip check
          python -m pip list

      - name: Verify installed package and native extensions
        # Import outside the checkout so the source tree cannot shadow the
        # installed wheel, which contains the compiled Caratheodory extension.
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import cvxpy
          import green_ac
          import green_igen
          import pyscf
          from green_mbtools import mint
          from green_mbtools.pesto import analyt_cont, caratheodory
          from green_mbtools.version import __version__

          required_solvers = {"SCS", "CLARABEL"}
          installed_solvers = set(cvxpy.installed_solvers())
          assert required_solvers <= installed_solvers, installed_solvers
          print(f"green-mbtools {__version__}; PySCF {pyscf.__version__}")
          print(f"Caratheodory extension: {caratheodory.__file__}")
          print(f"CVXPY solvers: {sorted(installed_solvers)}")
          PY

      - name: Run full test suite
        # Tests use shared scratch paths, so keep execution sequential.
        # Running here also avoids importing the unbuilt source package.
        working-directory: tests
        run: python -m pytest -ra --junitxml="${{ runner.temp }}/pytest-results.xml"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: ignore
